<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download Koinonia for iPhone, iPad, or Android.">
  <link rel="canonical" href="https://anthonios-deeb.github.io/koinonia-pages/install/">
  <title>Install Koinonia</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="install-page">
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="../">Koinonia</a>
      <nav class="nav" aria-label="Site navigation">
        <a href="../privacy/">Privacy</a>
        <a href="../terms/">Terms</a>
        <a href="../community-standards/">Community Standards</a>
        <a href="../support/">Support</a>
        <a href="../delete-account/">Delete Account</a>
        <a class="nav-cta" aria-current="page" href="./">Install App</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="shell download-section" aria-labelledby="download-title">
      <div class="download-card">
        <img class="app-icon" src="../assets/koinonia-app-icon.png" alt="Koinonia app icon" width="1024" height="1024">
        <div class="download-content">
          <p class="eyebrow">Available on iOS and Android</p>
          <h1 id="download-title">Get Koinonia on your phone</h1>
          <p class="download-copy">Stay connected with your community wherever you are.</p>
          <div class="store-links" aria-label="Download Koinonia">
            <a
              class="store-link"
              href="https://apps.apple.com/app/id6799269751"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Download Koinonia on the App Store (opens in a new tab)"
            >
              <img
                class="store-badge app-store-badge"
                src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                alt="Download on the App Store"
                width="120"
                height="40"
              >
            </a>
            <a
              class="store-link"
              href="https://play.google.com/store/apps/details?id=com.koinonia.community"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Get Koinonia on Google Play (opens in a new tab)"
            >
              <img
                class="store-badge google-play-badge"
                src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                alt="Get it on Google Play"
                width="646"
                height="250"
              >
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="shell">
      <p><strong>Koinonia</strong></p>
      <p>Policies last updated 17 August 2026 · <a href="../">Policies and Support</a></p>
    </div>
  </footer>
</body>
</html>
